name: Alertes Radar
on:
  schedule:
    - cron: "*/10 * * * *"     # toutes les 10 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:            # bouton "Run workflow" pour tester
concurrency:
  group: alertes
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-alertes.txt
      - run: pip install -r requirements-alertes.txt
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-
      - run: python alerts.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          MODEL: ${{ vars.MODEL }}
          MIN_IMPORTANCE: ${{ vars.MIN_IMPORTANCE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: radar-state-${{ github.run_id }}
 }}
